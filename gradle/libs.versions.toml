[versions]
agp = "8.7.3"
kotlin = "1.9.0"
compose-material3 = "1.3.1"
androidx-splash = "1.0.1"
androidx-lifecyle = "2.8.7"
androidx-activity-compose = "1.10.1"
compose-livedata = "1.7.8"
compose-compiler = "1.5.1"
compose-constraintlayout = "1.1.1"
navigation = "2.8.9"
core-ktx = "1.15.0"
coroutines = "1.9.0"
turbine = "1.2.0"
graphql = "3.8.5"
gson = "2.12.1"
javax = "1"
dagger = "2.50"
kover = "0.9.1"
ksp = "1.9.21-1.0.15"
androidx-test = "2.2.0"
junit = "4.13.2"
mockk = "1.12.4"
mockk-jvm = "1.13.2"
appcompat = "1.7.0"
material = "1.12.0"

[libraries]
androidx-splash = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splash" }
androidx-lifecyle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecyle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecyle" }
compose-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose-livedata" }
compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "compose-constraintlayout" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecyle" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
graphql = { group = "com.apollographql.apollo3", name = "apollo-runtime", version.ref = "graphql" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
javax = { group = "javax.inject", name = "javax.inject", version.ref = "javax" }
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-android = { group = "com.google.dagger", name = "dagger-android", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-test = { module = "androidx.arch.core:core-testing", version.ref = "androidx-test" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk-common", version.ref = "mockk" }
mockk-jvm = { module = "io.mockk:mockk-jvm", version.ref = "mockk-jvm" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
graphql = { id = "com.apollographql.apollo3", version.ref = "graphql" }
parcelise = { id = "kotlin-parcelize", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
