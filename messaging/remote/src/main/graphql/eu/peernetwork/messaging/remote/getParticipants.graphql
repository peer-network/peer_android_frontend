query GetParticipants($chatid: ID!, $offset: Int, $limit: Int) {
    getChat(chatid: $chatid, messageOffset: $offset, messageLimit: $limit) {
        status
        counter
        affectedRows {
            id
            chatparticipants {
                userid
                img
                username
                slug
                hasaccess
            }
        }
        ResponseCode
    }
}
