mutation AdvertisePostPinned(
    $postId: ID!,
    $advertisePlan: AdvertisementPinnedPlan!,
    $forceUpdate: Boolean,
) {
    advertisePostPinned(
        postid: $postId,
        advertisePlan: $advertisePlan
    ) {
        status
        ResponseCode
        affectedRows {
            id
            createdAt
            type
            timeframeStart
            timeframeEnd
            totalTokenCost
            totalEuroCost
        }
    }
}
