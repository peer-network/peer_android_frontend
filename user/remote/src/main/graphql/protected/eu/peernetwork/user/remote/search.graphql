query Searchuser($username: String!, $contentFilterBy: ContentFilterType, $offset: Int!, $limit: Int!) {
    searchUser(username: $username, contentFilterBy: $contentFilterBy, offset: $offset, limit: $limit) {
        status
        counter
        ResponseCode
        affectedRows {
            id
            slug
            username
            img
            biography
            isHiddenForUsers
            visibilityStatus
        }
    }
}
