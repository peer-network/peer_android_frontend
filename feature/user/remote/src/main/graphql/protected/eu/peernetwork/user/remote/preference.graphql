query Preference {
    getUserInfo {
        status
        ResponseCode
        affectedRows {
            userPreferences {
                contentFilteringSeverityLevel
                onboardingsWereShown
            }
        }
    }
}

mutation UpdateUserPreferences($mode: ContentFilterType, $flag: [OnboardingType!]) {
    updateUserPreferences(
        userPreferences: { contentFilteringSeverityLevel: $mode, shownOnboardings: $flag }
    ) {
        status
        ResponseCode
    }
}
