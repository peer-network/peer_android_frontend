query TransactionHistory(
    $type: TokenMovementFilterType,
    $start: String,
    $end: String,
    $limit: Int,
    $offset: Int,
    $sort: SortFilterType,
) {
    transactionHistory(
        type: $type
        start_date: null
        end_date: null
        limit: null
        offset: null
        sort: null
    ) {
        meta {
            status
            ResponseCode
        }
        affectedRows {
            operationid
            transactionId
            transactionCategory
            transactiontype
            tokenamount
            netTokenAmount
            sender {
                userid
                img
                username
                slug
                biography
                visibilityStatus
                isHiddenForUsers
                hasActiveReports
                updatedat
            }
            recipient {
                userid
                img
                username
                slug
                biography
                visibilityStatus
                isHiddenForUsers
                hasActiveReports
                updatedat
            }
            fees {
                total
                burn
                peer
                inviter
            }
            message
            createdat
        }
    }
}
