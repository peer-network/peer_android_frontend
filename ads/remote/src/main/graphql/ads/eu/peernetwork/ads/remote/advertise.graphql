mutation AdvertisePostPinned(
    $postId: ID!,
    $advertisePlan: AdvertisementPinnedPlan!,
) {
    advertisePostPinned(postid: $postId, advertisePlan: $advertisePlan) {
        status
        ResponseCode
        affectedRows {
            type
            timeframeStart
            timeframeEnd
            totalTokenCost
            totalEuroCost
        }
    }
}
