query ListPeers(
    $offset: Int!,
    $limit: Int!,
    $contentFilterBy: ContentFilterType,
) {
    listFriends(
        offset: $offset,
        limit: $limit,
        contentFilterBy: $contentFilterBy,
    ) {
        status
        counter
        ResponseCode
        affectedRows {
            userid
            img
            username
            slug
            biography
            updatedat
        }
    }
}
