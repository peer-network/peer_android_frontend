name: Android CI
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variable
        run: | 
          echo "JAVA_VERSION=17" >> $GITHUB_ENV
          echo "JAVA_DISTRIBUTION=temurin" >> $GITHUB_ENV

      - name: Checking out application repository
        uses: actions/checkout@v5

      - name: Install jq (for JSON validation)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          cat app/google-services.json | jq .

      - name: Configuring JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configuring Android SDK
        uses: android-actions/setup-android@v3

      - name: Configuring gradle build and permission
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ secrets.ANDROID_HOME }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report
        run: ./gradlew koverHtmlReport

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: build/reports/kover/html/

      - name: Build Debug apk
        if: github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload Debug apk as artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release apk
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease

      - name: Upload Release apk as artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  map_pr_to_discord:
    name: Map PR to Discord User
    runs-on: ubuntu-latest
    outputs:
      discord_mention: ${{ steps.map.outputs.discord_mention }}
    steps:
      - name: Map GitHub username to Discord ID
        id: map
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "${{ github.event.pull_request.user.login }}" in
            WisdomNwaiwu)
              echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
              ;;
            jakobPeer)
              echo "discord_mention=<@1334087880833892392>" >> $GITHUB_OUTPUT
              ;;
            Novachrono-Ryhze)
              echo "discord_mention=<@1228316710264897596>" >> $GITHUB_OUTPUT
              ;;
            SandrZeus)
              echo "discord_mention=<@273771478242295809>" >> $GITHUB_OUTPUT
              ;;
            conxtantyn)
              echo "discord_mention=<@1354048093376610366>" >> $GITHUB_OUTPUT
              ;;
            NotBrightLight)
              echo "discord_mention=<@310723093863858176>" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
              ;;
          esac

  send_success_discord_notification:
    name: Send Discord Notification for Successful CI
    runs-on: ubuntu-latest
    needs: [build, map_pr_to_discord]
    if: needs.build.result == 'success'
    steps:
      - name: Send success notification
        env:
          ANDROID_DISCORD: ${{ secrets.ANDROID_DISCORD }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE=":white_check_mark: **Android CI Passed Successfully**\n"
          MESSAGE+="**PR:** $PR_TITLE\n"
          MESSAGE+="PR Link: <$PR_URL>\n"
          MESSAGE+="CI Run: <$RUN_URL>\n"
          MESSAGE+="<@1354048093376610366>"
          MESSAGE+="Maintainer: <@1362087975906967736>\n"
          MESSAGE+="Author: ${{ needs.map_pr_to_discord.outputs.discord_mention }}"
          MESSAGE+="\nPR still requires **Team Lead Approval** before merge."
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"${MESSAGE}\"}" \
               "$ANDROID_DISCORD"

  final_check:
    name: Fail workflow if build failed
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result != 'success'
    steps:
      - run: |
          echo "Failing workflow to block merge (reason: build did not succeed)"
          exit 1
