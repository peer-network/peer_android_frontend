name: Android CI
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - development

jobs:
  check_branch_sync:
    name: Check if PR Branch is Behind Base
    runs-on: ubuntu-latest
    outputs:
      is_behind: ${{ steps.check.outputs.is_behind }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch origin +refs/heads/*:refs/remotes/origin/*

      - id: check
        run: |
          base_branch="${{ github.event.pull_request.base.ref }}"
          pr_branch="${{ github.event.pull_request.head.ref }}"
          behind=$(git rev-list --left-right --count origin/${base_branch}...origin/${pr_branch} | awk '{print $1}')
          if [ "$behind" -gt 0 ]; then
            echo "is_behind=true" >> $GITHUB_OUTPUT
          else
            echo "is_behind=false" >> $GITHUB_OUTPUT
          fi

  gitleaks:
    name: Run Gitleaks Scan
    needs: check_branch_sync
    if: needs.check_branch_sync.outputs.is_behind == 'false'
    uses: peer-network/peer_global_security/.github/workflows/gitleaks.yml@main
    with:
      config: gitleaks.toml

  build:
    runs-on: ubuntu-latest
    needs: [check_branch_sync, gitleaks]
    if: needs.check_branch_sync.outputs.is_behind == 'false' && needs.gitleaks.result == 'success'
    steps:
      - name: Set environment variable
        run: | 
          echo "JAVA_VERSION=17" >> $GITHUB_ENV
          echo "JAVA_DISTRIBUTION=temurin" >> $GITHUB_ENV

      - name: Checking out application repository
        uses: actions/checkout@v5

      - name: Install jq (for JSON validation)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          jq . app/google-services.json
          
      - name: Configuring JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configuring Android SDK
        uses: android-actions/setup-android@v3

      - name: Configuring gradle build and permission
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ secrets.ANDROID_HOME }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report
        run: ./gradlew koverHtmlReport

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: build/reports/kover/html/

      - name: Build Debug apk
        if: github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload Debug apk as artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release apk
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease

      - name: Upload Release apk as artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  map_pr_to_discord:
    name: Map PR to Discord User
    runs-on: ubuntu-latest
    outputs:
      discord_mention: ${{ steps.map.outputs.discord_mention }}
    steps:
      - name: Map GitHub username to Discord ID
        id: map
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "${{ github.event.pull_request.user.login }}" in
            WisdomNwaiwu)
              echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
              ;;
            jakobPeer)
              echo "discord_mention=<@1334087880833892392>" >> $GITHUB_OUTPUT
              ;;
            Novachrono-Ryhze)
              echo "discord_mention=<@1228316710264897596>" >> $GITHUB_OUTPUT
              ;;
            SandrZeus)
              echo "discord_mention=<@273771478242295809>" >> $GITHUB_OUTPUT
              ;;
            conxtantyn)
              echo "discord_mention=<@1354048093376610366>" >> $GITHUB_OUTPUT
              ;;
            NotBrightLight)
              echo "discord_mention=<@310723093863858176>" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
              ;;
          esac

  send_success_discord_notification:
    name: Send Discord Notification for Successful CI
    runs-on: ubuntu-latest
    needs: [build, map_pr_to_discord]
    if: needs.build.result == 'success'
    steps:
      - name: Send success notification
        env:
          ANDROID_DISCORD: ${{ secrets.ANDROID_DISCORD }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEAM_LEAD: "<@1354048093376610366>"
        run: |
          MESSAGE=":white_check_mark: **Android CI Passed Successfully**\n"
          MESSAGE+="**PR:** $PR_TITLE\n"
          MESSAGE+="PR Link: <$PR_URL>\n"
          MESSAGE+="CI Run: <$RUN_URL>\n\n"
          MESSAGE+="$TEAM_LEAD"
          
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"${MESSAGE}\"}" \
               "$ANDROID_DISCORD"

  final_check:
    name: Fail workflow if build failed
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result != 'success'
    steps:
      - run: |
          echo "Failing workflow to block merge (reason: build did not succeed)"
          exit 1
