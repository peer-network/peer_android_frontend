name: Android CI
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variable
        run: | 
          echo "JAVA_VERSION=17" >> $GITHUB_ENV
          echo "JAVA_DISTRIBUTION=temurin" >> $GITHUB_ENV

      - name: Checking out application repository
        uses: actions/checkout@v3

      - name: Configuring JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configuring gradle access permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest

      - name: Generate coverage report
        run: ./gradlew koverHtmlReport

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: build/reports/kover/html/

      - name: Build Debug apk
        if: github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload Debug apk as artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release apk
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease

      - name: Upload Release apk as artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/release/app-release.apk
