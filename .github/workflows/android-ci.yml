name: Android CI
on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  check_branch_sync:
    name: Check if PR Branch is Behind Base
    runs-on: ubuntu-latest
    outputs:
      is_behind: ${{ steps.check.outputs.is_behind }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch origin +refs/heads/*:refs/remotes/origin/*

      - id: check
        run: |
          base_branch="${{ github.event.pull_request.base.ref }}"
          pr_branch="${{ github.event.pull_request.head.ref }}"
          behind=$(git rev-list --left-right --count origin/${base_branch}...origin/${pr_branch} | awk '{print $1}')
          if [ "$behind" -gt 0 ]; then
            echo "is_behind=true" >> $GITHUB_OUTPUT
          else
            echo "is_behind=false" >> $GITHUB_OUTPUT
          fi

  gitleaks:
    name: Run Gitleaks Scan
    needs: check_branch_sync
    if: needs.check_branch_sync.outputs.is_behind == 'false'
    uses: peer-network/peer_global_security/.github/workflows/gitleaks.yml@main
    with:
      config: gitleaks.toml

  trivy_scan:
    name: Run Trivy Security Scan
    needs: [gitleaks]
    if: needs.gitleaks.result == 'success'
    uses: peer-network/.github/.github/workflows/trivy-scan.yml@main
    with:
      scan_target: .

  build:
    runs-on: ubuntu-latest
    needs: [check_branch_sync, gitleaks, trivy_scan]
    if: needs.check_branch_sync.outputs.is_behind == 'false' && needs.gitleaks.result == 'success'
    steps:
      - name: Set environment variable
        run: | 
          echo "JAVA_VERSION=17" >> $GITHUB_ENV
          echo "JAVA_DISTRIBUTION=temurin" >> $GITHUB_ENV

      - name: Checking out application repository
        uses: actions/checkout@v6

      - name: Install jq (for JSON validation)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          jq . app/google-services.json
          
      - name: Configuring JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configuring Android SDK
        uses: android-actions/setup-android@v3

      - name: Configuring gradle build and permission
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ secrets.ANDROID_HOME }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report
        run: ./gradlew koverHtmlReport

      - name: Upload coverage report as artifact
        uses: peer-network/.github/.github/actions/upload-artifact@main
        with:
          name: kover-coverage-report
          path: build/reports/kover/html/

      - name: Build Debug apk
        if: github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload Debug apk as artifact
        if: github.ref != 'refs/heads/main'
        uses: peer-network/.github/.github/actions/upload-artifact@main
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release apk
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease

      - name: Upload Release apk as artifact
        if: github.ref == 'refs/heads/main'
        uses: peer-network/.github/.github/actions/upload-artifact@main
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  map_pr_to_discord:
    name: Map PR to Discord User
    runs-on: ubuntu-latest
    outputs:
      discord_mention: ${{ steps.map.outputs.discord_mention }}
    steps:
      - name: Map GitHub username to Discord ID
        id: map
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "${{ github.event.pull_request.user.login }}" in
            WisdomNwaiwu)
              echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
              ;;
            jakobPeer)
              echo "discord_mention=<@1334087880833892392>" >> $GITHUB_OUTPUT
              ;;
            conxtantyn)
              echo "discord_mention=<@1354048093376610366>" >> $GITHUB_OUTPUT
              ;;
            NotBrightLight)
              echo "discord_mention=<@310723093863858176>" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "discord_mention=<@1362087975906967736>" >> $GITHUB_OUTPUT
              ;;
          esac

  determine_event_type:
    name: Determine Discord Event Type
    runs-on: ubuntu-latest
    needs: [check_branch_sync, gitleaks, trivy_scan, build]
    outputs:
      event_type: ${{ steps.set_type.outputs.event_type }}
    steps:
      - id: set_type
        run: |
          if [ "${{ needs.check_branch_sync.outputs.is_behind }}" == "true" ]; then
            echo "event_type=behind" >> $GITHUB_OUTPUT
          elif [ "${{ needs.gitleaks.result }}" == "failure" ]; then
            echo "event_type=gitleaks_failed" >> $GITHUB_OUTPUT
          elif [ "${{ needs.trivy_scan.outputs.has_findings }}" == "true" ]; then
            echo "event_type=trivy_vulnerabilities" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "event_type=build_failed" >> $GITHUB_OUTPUT
          else
            echo "event_type=success" >> $GITHUB_OUTPUT
          fi

  send_discord_notification:
    name: Unified Discord Notification
    runs-on: ubuntu-latest
    needs: [check_branch_sync, gitleaks, trivy_scan, build, map_pr_to_discord, determine_event_type]
    if: always()
    uses: peer-network/.guthub/.github/workflows/discord-notify.yml@main
    with:
      repo_name: "Android Frontend"
      event_type: ${{ needs.determine_event_type.outputs.event_type }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_url: ${{ github.event.pull_request.html_url }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      discord_mention: ${{ needs.map_pr_to_discord.outputs.discord_mention }}
      secrets:
        webhook: ${{ secrets.ANDROID_DISCORD }}

  final_check:
    name: Final Check — Block Merge if Any Critical Job Failed
    runs-on: ubuntu-latest
    needs: [check_branch_sync, gitleaks, trivy_scan, build]
    if: always()
    steps:
      - run: |
          echo "Running final integrity check..."
          if [ "${{ needs.check_branch_sync.outputs.is_behind }}" == "true" ]; then
            echo "PR branch is behind base branch."
            exit 1
          fi
          if [ "${{ needs.gitleaks.result }}" == "failure" ]; then
            echo "Gitleaks detected secrets."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build or tests failed."
            exit 1
          fi
          echo "All critical checks passed successfully."